<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AIY — Mataimakin AI na Hausa</title>
<style>
  :root{
    --maroon-deep:#5A1A1F;
    --maroon-mid:#7A2530;
    --gold:#B8860B;
    --gold-light:#E3B04B;
    --sand:#F5EEE0;
    --ink:#2B1E14;
    --line:#E3D2AE;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--sand);
    color:var(--ink);
    height:100vh;
    overflow:hidden;
    display:flex;
  }

  /* ---------- Sidebar ---------- */
  #sidebar{
    position:fixed;
    top:0; left:0; bottom:0;
    width:78%;
    max-width:300px;
    background:var(--maroon-deep);
    color:var(--sand);
    transform:translateX(-100%);
    transition:transform 0.25s ease;
    z-index:20;
    display:flex;
    flex-direction:column;
    padding:14px 10px;
  }
  #sidebar.open{transform:translateX(0);}
  #overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.4);
    opacity:0; pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:15;
  }
  #overlay.show{opacity:1; pointer-events:auto;}

  #newChatBtn{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--gold);
    color:var(--maroon-deep);
    border:none;
    border-radius:10px;
    padding:11px 14px;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    margin-bottom:14px;
  }

  #sideLabel{
    font-size:11.5px;
    color:#D9B7A8;
    padding:4px 8px 6px;
    letter-spacing:0.2px;
  }

  #convList{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .convItem{
    padding:10px 10px;
    border-radius:8px;
    font-size:14px;
    color:#F0E2D8;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .convItem:active{background:rgba(255,255,255,0.08);}
  .convItem.active{background:var(--maroon-mid); color:#fff;}

  #sideFooter{
    font-size:11px;
    color:#C79A85;
    padding:10px 8px 4px;
    border-top:1px solid rgba(255,255,255,0.12);
    margin-top:8px;
  }

  /* ---------- Main area ---------- */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    height:100vh;
    min-width:0;
  }

  header{
    background:var(--maroon-deep);
    color:var(--sand);
    padding:14px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
    border-bottom:3px solid var(--gold);
  }
  #menuBtn{
    background:none;
    border:none;
    color:var(--sand);
    font-size:22px;
    line-height:1;
    padding:4px 8px;
    cursor:pointer;
  }
  header .titles{display:flex; flex-direction:column; flex:1; min-width:0;}
  header .mark{font-size:19px; font-weight:700;}
  header .sub{font-size:11.5px; color:#D9B7A8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #newChatIcon{
    background:none;
    border:none;
    color:var(--gold-light);
    font-size:22px;
    padding:4px 8px;
    cursor:pointer;
  }

  #chat{
    flex:1;
    overflow-y:auto;
    padding:16px 14px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    -webkit-overflow-scrolling:touch;
  }

  .empty{
    margin:auto;
    text-align:center;
    color:#8A7A5F;
    max-width:280px;
    font-size:14.5px;
    line-height:1.6;
  }
  .empty b{color:var(--maroon-deep);}

  .row{display:flex; width:100%;}
  .row.user{justify-content:flex-end;}
  .row.bot{justify-content:flex-start;}

  .bubble{
    max-width:80%;
    padding:10px 13px;
    border-radius:14px;
    font-size:15.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .row.user .bubble{
    background:var(--maroon-deep);
    color:var(--sand);
    border-bottom-right-radius:3px;
  }
  .row.bot .bubble{
    background:#FFFDF8;
    color:var(--ink);
    border:1px solid var(--line);
    border-bottom-left-radius:3px;
  }

  .thinking{display:flex; gap:4px; padding:4px 2px;}
  .thinking span{
    width:6px; height:6px; border-radius:50%;
    background:var(--maroon-mid);
    opacity:0.4;
    animation:pulse 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2){animation-delay:0.15s;}
  .thinking span:nth-child(3){animation-delay:0.3s;}
  @keyframes pulse{0%,80%,100%{opacity:0.25; transform:scale(0.85);} 40%{opacity:1; transform:scale(1);}}

  form{
    flex-shrink:0;
    display:flex;
    gap:8px;
    padding:10px;
    background:#FFFDF8;
    border-top:1px solid var(--line);
  }
  textarea{
    flex:1;
    resize:none;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:16px;
    font-family:inherit;
    line-height:1.4;
    max-height:100px;
    background:var(--sand);
    color:var(--ink);
  }
  textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
  button.send{
    border:none;
    background:var(--gold);
    color:var(--maroon-deep);
    font-weight:700;
    font-size:15px;
    padding:0 18px;
    border-radius:10px;
    cursor:pointer;
    flex-shrink:0;
  }
  button.send:disabled{opacity:0.5;}
  button.send:active{transform:scale(0.97);}

  .errbar{
    background:#7A2E2E;
    color:#fff;
    font-size:13px;
    padding:8px 14px;
    text-align:center;
    flex-shrink:0;
  }
</style>
</head>
<body>

<div id="overlay"></div>
<div id="sidebar">
  <button id="newChatBtn">＋ Sabon Tattaunawa</button>
  <div id="sideLabel">TATTAUNAWOWI NA BAYA</div>
  <div id="convList"></div>
  <div id="sideFooter">AIY · An kirkira shi da Abubakar Isah Yarima</div>
  <button id="signOutBtn" style="margin-top:8px; background:none; border:1px solid rgba(255,255,255,0.3); color:#F0E2D8; border-radius:8px; padding:8px; font-size:13px; cursor:pointer;">Fita (Sign out)</button>
</div>

<div id="loginScreen" style="position:fixed; inset:0; background:var(--sand); z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;">
  <div style="font-size:28px; font-weight:700; color:var(--maroon-deep); margin-bottom:6px;">AIY</div>
  <div style="font-size:14px; color:#8A7A5F; margin-bottom:28px;">Mataimakin AI na Hausa</div>
  <button id="googleSignInBtn" style="background:var(--maroon-deep); color:var(--sand); border:none; border-radius:10px; padding:13px 22px; font-size:15px; font-weight:700; cursor:pointer;">Shiga da Google</button>
  <div id="loginError" style="color:#7A2E2E; font-size:12.5px; margin-top:14px; max-width:280px;"></div>
</div>

<div id="main">
  <header>
    <button id="menuBtn">☰</button>
    <div class="titles">
      <span class="mark">AIY</span>
      <span class="sub" id="convTitle">Sabon Tattaunawa</span>
    </div>
    <button id="newChatIcon">＋</button>
  </header>

  <div id="chat">
    <div class="empty" id="emptyState">
      <b>Sannu!</b><br>
      Ni AIY ne. Za ka iya tambaye ni komai cikin Hausa — ilimi, rubutu, fassara, ko wani abu.
    </div>
  </div>

  <div id="errbar" class="errbar" style="display:none"></div>

  <form id="chatForm">
    <textarea id="input" rows="1" placeholder="Rubuta tambayarka nan..." autocomplete="off"></textarea>
    <button type="submit" class="send" id="sendBtn">Aika</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCqgKLZgbo8UWyKdBK-7v-9HFkf0QzyN4o",
    authDomain: "aiy1-ccb5a.firebaseapp.com",
    databaseURL: "https://aiy1-ccb5a-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "aiy1-ccb5a",
    storageBucket: "aiy1-ccb5a.firebasestorage.app",
    messagingSenderId: "586538485885",
    appId: "1:586538485885:web:9d6477d53386f2ce62c914",
    measurementId: "G-KTE1XXGMEK"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
</script>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('chatForm');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');
const errbar = document.getElementById('errbar');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const menuBtn = document.getElementById('menuBtn');
const newChatBtn = document.getElementById('newChatBtn');
const newChatIcon = document.getElementById('newChatIcon');
const convList = document.getElementById('convList');
const convTitle = document.getElementById('convTitle');

const PROXY_URL = "https://malurigarinallah--3108960caaa911f1b13f1607ee4eb77e.web.val.run";
const DB_URL = "https://aiy1-ccb5a-default-rtdb.europe-west1.firebasedatabase.app";

const loginScreen = document.getElementById('loginScreen');
const googleSignInBtn = document.getElementById('googleSignInBtn');
const loginError = document.getElementById('loginError');
const signOutBtn = document.getElementById('signOutBtn');

let currentUid = null;

googleSignInBtn.addEventListener('click', () => {
  loginError.textContent = '';
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithRedirect(provider).catch(err => {
    loginError.textContent = 'Kuskure: ' + err.message;
  });
});

auth.getRedirectResult().catch(err => {
  loginError.textContent = 'Kuskuren shiga: ' + err.message;
});

signOutBtn.addEventListener('click', () => auth.signOut());

auth.onAuthStateChanged(user => {
  if(user){
    currentUid = user.uid;
    loginScreen.style.display = 'none';
    initApp();
  }else{
    currentUid = null;
    loginScreen.style.display = 'flex';
  }
});

async function loadConversationsFromDB(){
  try{
    const res = await fetch(`${DB_URL}/conversations/${currentUid}.json`);
    if(!res.ok){
      const detail = await res.text().catch(()=> "");
      showError('Kuskuren loda bayanai: HTTP ' + res.status + ' — ' + detail.slice(0,150));
      conversations = [];
      return;
    }
    const data = await res.json();
    if(data){
      conversations = Object.keys(data).map(id => ({
        id,
        title: data[id].title || 'Sabon Tattaunawa',
        history: data[id].history || [],
        updatedAt: data[id].updatedAt || 0
      })).sort((a,b) => b.updatedAt - a.updatedAt);
    }else{
      conversations = [];
    }
  }catch(e){
    showError('Kuskuren haɗin database (loda): ' + e.message);
    conversations = [];
  }
}

async function saveConversationToDB(conv){
  try{
    const res = await fetch(`${DB_URL}/conversations/${currentUid}/${conv.id}.json`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ title: conv.title, history: conv.history, updatedAt: Date.now() })
    });
    if(!res.ok){
      const detail = await res.text().catch(()=> "");
      showError('Kuskuren ajiyewa: HTTP ' + res.status + ' — ' + detail.slice(0,150));
    }
  }catch(e){
    showError('Kuskuren haɗin database (ajiyewa): ' + e.message);
  }
}

// In-memory only: conversations reset when the page is closed/reloaded.
let conversations = [];
let activeId = null;

function newId(){ return 'c' + Date.now() + Math.random().toString(36).slice(2,6); }

function createConversation(){
  const conv = { id:newId(), title:'Sabon Tattaunawa', history:[] };
  conversations.unshift(conv);
  activeId = conv.id;
  renderSidebarList();
  renderActiveConversation();
  closeSidebar();
}

function getActive(){
  return conversations.find(c => c.id === activeId);
}

function renderSidebarList(){
  convList.innerHTML = '';
  conversations.forEach(c => {
    const item = document.createElement('div');
    item.className = 'convItem' + (c.id === activeId ? ' active' : '');
    item.textContent = c.title;
    item.addEventListener('click', () => {
      activeId = c.id;
      renderSidebarList();
      renderActiveConversation();
      closeSidebar();
    });
    convList.appendChild(item);
  });
}

function renderActiveConversation(){
  const conv = getActive();
  chat.innerHTML = '';
  convTitle.textContent = conv ? conv.title : 'Sabon Tattaunawa';
  if(!conv || conv.history.length === 0){
    chat.innerHTML = '<div class="empty" id="emptyState"><b>Sannu!</b><br>Ni AIY ne. Za ka iya tambaye ni komai cikin Hausa — ilimi, rubutu, fassara, ko wani abu.</div>';
    return;
  }
  conv.history.forEach(turn => {
    const who = turn.role === 'user' ? 'user' : 'bot';
    addBubbleToDOM(turn.parts[0].text, who);
  });
}

function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('show'); }
function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
menuBtn.addEventListener('click', openSidebar);
overlay.addEventListener('click', closeSidebar);
newChatBtn.addEventListener('click', createConversation);
newChatIcon.addEventListener('click', createConversation);

function autoGrow(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
}
input.addEventListener('input', autoGrow);

function scrollDown(){ chat.scrollTop = chat.scrollHeight; }

function speakText(text){
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ha-NG';
    utter.rate = 0.95;
    window.speechSynthesis.speak(utter);
  }catch(e){
    showError('Murya ba ta aiki a wannan na\u0257i ba.');
  }
}

function addBubbleToDOM(text, who){
  const empty = document.getElementById('emptyState');
  if(empty) empty.remove();
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  if(who === 'bot'){
    const speakBtn = document.createElement('button');
    speakBtn.textContent = '\ud83d\udd0a';
    speakBtn.title = 'Karanta da murya';
    speakBtn.style.cssText = 'border:none;background:transparent;font-size:15px;cursor:pointer;padding:2px 4px;margin-top:4px;';
    speakBtn.addEventListener('click', () => speakText(text));
    b.appendChild(document.createElement('br'));
    b.appendChild(speakBtn);
  }
  chat.appendChild(row);
  scrollDown();
  return b;
}

function addThinking(){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.id = 'thinkingRow';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
  row.appendChild(b);
  chat.appendChild(row);
  scrollDown();
}
function removeThinking(){
  const r = document.getElementById('thinkingRow');
  if(r) r.remove();
}

function showError(msg){
  errbar.textContent = msg;
  errbar.style.display = 'block';
  setTimeout(()=>{ errbar.style.display = 'none'; }, 5000);
}

async function askAIY(conv){
  const systemPrompt = "Kai 'AIY' ne, wani mataimakin AI wanda ke magana da Hausa tsantsa kawai, ko da an tambaye ka da wani harshe daban. Kana da kwarewa ta musamman a fannin siyasa, gwamnati, tarihi/al'adun Hausa, harshen Larabci, da kuma fannin AI da fasahar zamani (technology) — idan tambaya ta shafi wa\u0257annan fannoni, ka bayar da zurfin bayani da misalai masu dacewa. Halinka mai ladabi ne amma mai sauki da abokantaka — ba mai tsananin fa\u0257akarwa ba, kana magana kamar wani aboki mai hikima, ba wai wani jami'i mai tsauri ba. Ka bayyana abubuwa a taka\u0197ce, cikin sauki, don kowa ya fahimta — har da wanda bai yi karatun boko sosai ba. Idan tambaya ta shafi rubutu (kamar sanarwa, jawabi, ko labari), ka taimaka da kyakkyawan tsari. Kada ka yi amfani da harshen Turanci sai dai in an bukaci fassara. Idan wani ya tambaye ka menene sunan 'AIY' ke nufi, ko waye ya kirkire ka, ka amsa haka: sunan AIY gajarce ne na Abubakar Isah Yarima. An kirkire ka ne da wani basarake mai suna Abubakar Isah Yarima, \u0257an jahar Yobe, daga Karamar Hukumar Fika, a garin Maluri.";

  const url = PROXY_URL;

  const identityPrimer = [
    { role:'user', parts:[{text:'Wanene kai, kuma wa ya kirkire ka?'}] },
    { role:'model', parts:[{text:'Ni AIY ne — gajarcen sunan Abubakar Isah Yarima. Wani basarake mai suna Abubakar Isah Yarima ne ya kirkire ni, ɗan jahar Yobe, daga Karamar Hukumar Fika, a garin Maluri.'}] }
  ];

  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [...identityPrimer, ...conv.history],
      systemInstruction: { parts: [{ text: systemPrompt }] }
    })
  });

  if(!response.ok){
    let detail = '';
    try{ detail = await response.text(); }catch(e){}
    throw new Error("HTTP " + response.status + ": " + detail.slice(0,200));
  }

  const data = await response.json();
  const parts = data?.candidates?.[0]?.content?.parts || [];
  const reply = parts.map(p => p.text || "").join("").trim() || "Yi hakuri, ban samu amsa ba. Ka sake gwadawa.";
  return reply;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;

  if(!activeId) createConversation();
  const conv = getActive();

  if(conv.history.length === 0){
    conv.title = text.length > 28 ? text.slice(0,28) + '…' : text;
    renderSidebarList();
    convTitle.textContent = conv.title;
  }

  conv.history.push({ role:'user', parts:[{text}] });
  addBubbleToDOM(text, 'user');
  input.value = '';
  autoGrow();
  input.disabled = true;
  sendBtn.disabled = true;
  addThinking();

  try{
    const reply = await askAIY(conv);
    removeThinking();
    conv.history.push({ role:'model', parts:[{text:reply}] });
    addBubbleToDOM(reply, 'bot');
    saveConversationToDB(conv);
  }catch(err){
    removeThinking();
    showError('Kuskure: ' + (err && err.message ? err.message : String(err)));
    conv.history.pop();
  }finally{
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
});

input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    form.requestSubmit();
  }
});

// Load past conversations from the database, then start (called after sign-in)
async function initApp(){
  await loadConversationsFromDB();
  if(conversations.length > 0){
    activeId = conversations[0].id;
    renderSidebarList();
    renderActiveConversation();
  }else{
    createConversation();
  }
}
</script>

</body>
</html>
